<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cobham Studio</title>
    <script>
    "use strict";
    try {
      const saved = localStorage.getItem("cobham_studio_theme");
      if (
        saved === "dark" ||
        (saved !== "light" &&
          window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    } catch {
      /* Bỏ qua nếu môi trường chặn đọc localStorage. */
    }
    </script>
    <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
      background: #eceef1;
    }
    #bootstrap-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #14161a;
      background: #eceef1;
    }
    .bootstrap-content {
      width: min(100%, 360px);
      text-align: center;
    }
    .bootstrap-mark {
      display: grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin: 0 auto 22px;
      color: white;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      border-radius: 19px;
      box-shadow: 0 14px 30px rgba(79, 70, 229, 0.24);
    }
    .bootstrap-title {
      margin: 0;
      font-size: 23px;
      font-weight: 750;
      letter-spacing: -0.035em;
    }
    .bootstrap-subtitle {
      margin: 8px 0 25px;
      font-size: 14px;
      color: #5b6270;
    }
    .bootstrap-track {
      height: 4px;
      overflow: hidden;
      background: #dde0e6;
      border-radius: 99px;
    }
    .bootstrap-progress {
      width: 36%;
      height: 100%;
      background: #4f46e5;
      border-radius: inherit;
      animation: bootstrap-move 1.5s ease-in-out infinite alternate;
    }
    .bootstrap-status {
      margin: 12px 0 0;
      font-size: 12px;
      color: #5b6270;
    }
    .bootstrap-retry {
      padding: 9px 16px;
      margin-top: 16px;
      font: inherit;
      font-size: 13px;
      color: white;
      cursor: pointer;
      background: #4f46e5;
      border: 0;
      border-radius: 10px;
    }
    @keyframes bootstrap-move {
      from {
        transform: translateX(0);
      }
      to {
        transform: translateX(178%);
      }
    }
    html.dark,
    html.dark body {
      background: #14161d;
    }
    html.dark #bootstrap-screen {
      color: #e8eaf0;
      background: #14161d;
    }
    html.dark .bootstrap-subtitle,
    html.dark .bootstrap-status {
      color: #98a0b2;
    }
    html.dark .bootstrap-track {
      background: #262a36;
    }
    html.dark .bootstrap-progress {
      background: #818cf8;
    }
    html.dark .bootstrap-retry {
      background: #6366f1;
    }
    @media (prefers-reduced-motion: reduce) {
      .bootstrap-progress {
        width: 100%;
        animation: none;
      }
    }
    </style>
  </head>

  <body>
    <div id="bootstrap-screen" role="status" aria-live="polite">
      <div class="bootstrap-content">
        <div class="bootstrap-mark" aria-hidden="true">
          <svg
            width="35"
            height="35"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <title>Cobham Studio</title>
            <path d="M11 5 6 9H3v6h3l5 4V5Z" />
            <path d="M15.5 8.5a5 5 0 0 1 0 7" />
            <path d="M19 5a10 10 0 0 1 0 14" />
          </svg>
        </div>
        <h1 class="bootstrap-title">Cobham Studio</h1>
        <p class="bootstrap-subtitle">Chuẩn bị không gian sáng tạo giọng nói</p>
        <div class="bootstrap-track">
          <div class="bootstrap-progress"></div>
        </div>
        <p class="bootstrap-status">Đang mở giao diện...</p>
        <button
          class="bootstrap-retry"
          id="bootstrap-retry"
          type="button"
          hidden
          onclick="location.reload()"
        >
          Tải lại giao diện
        </button>
      </div>
    </div>
    <div id="root"></div>
    <script>
    "use strict";
    setTimeout(() => {
      if (document.getElementById("bootstrap-screen")) {
        document.querySelector(".bootstrap-status").textContent =
          "Giao diện khởi động lâu hơn dự kiến. Bạn có thể thử tải lại.";
        document.getElementById("bootstrap-retry").hidden = false;
      }
    }, 15_000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
